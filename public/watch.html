<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>צפייה בסרטון</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="player-page">
    <div class="topbar">
      <div>
        <strong id="hello">טוען…</strong>
        <div class="muted small" id="exp"></div>
      </div>
      <button class="ghost small" id="logout">יציאה</button>
    </div>

    <div class="stage" id="stage">
      <video id="video" controls playsinline preload="metadata"
             controlsList="nodownload nofullscreen noremoteplayback noplaybackrate"
             disablePictureInPicture disableRemotePlayback></video>
      <button class="fs-btn" id="fs" type="button">⛶ מסך מלא</button>
      <div class="watermark" id="wm"></div>
      <div class="watermark faint" id="wm2"></div>
    </div>
    <div class="error notice" id="err" role="alert"></div>
  </div>

  <script src="/vendor/hls.min.js"></script>
  <script src="/watch.js"></script>
</body>
</html>
